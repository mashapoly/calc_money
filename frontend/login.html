<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2563eb" />
<title>Вход — Сплит-копилка</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo">💸</div>
      <div class="auth-title">Вход</div>
      <div class="auth-subtitle">Считаем, кто кому должен, в реальном времени</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Логин</label>
          <input id="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn block" type="submit">Войти</button>
        <div class="error" id="error"></div>
      </form>

      <div class="auth-footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
