<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2563eb" />
<title>Группа — Сплит-копилка</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="back-link">← Мои группы</a>
    <div class="topbar-title" id="group-name">Загрузка…</div>
    <div class="topbar-actions">
      <span class="live-status"><span class="live-dot" id="live-dot" title="Статус соединения"></span> live</span>
    </div>
  </header>

  <main class="page">
    <div class="layout-columns">
      <aside>
        <div class="summary-card" id="summary-card">
          <div class="summary-label">Ваш баланс в группе</div>
          <div class="summary-value" id="my-balance">—</div>
          <div class="summary-hint" id="my-balance-hint">Загружаем данные…</div>
        </div>

        <div class="section-title">Участники</div>
        <div class="card">
          <div class="members-row" id="members-list"></div>
        </div>
      </aside>

      <section>
        <div class="toolbar">
          <div class="tabs" style="margin-bottom:0;border-bottom:none">
            <button class="tab-btn active" data-tab="mybalance">Баланс</button>
            <button class="tab-btn" data-tab="expenses">Расходы</button>
            <button class="tab-btn" data-tab="alldebts">Все долги</button>
            <button class="tab-btn" data-tab="analytics">Аналитика</button>
          </div>
          <button class="btn" id="open-expense-btn">+ Добавить трату</button>
        </div>

        <div id="tab-mybalance">
          <div class="list-group" id="mybalance-list"><div class="empty">Загрузка…</div></div>
        </div>

        <div id="tab-expenses" style="display:none">
          <div class="list-group" id="expenses-list"><div class="empty">Загрузка…</div></div>
        </div>

        <div id="tab-alldebts" style="display:none">
          <div class="section-title" style="margin-top:0">Общие задолженности в группе</div>
          <div class="list-group" id="all-debts-list"><div class="empty">Загрузка…</div></div>
        </div>

        <div id="tab-analytics" style="display:none">
          <div class="section-title" style="margin-top:0">Траты по месяцам</div>
          <div class="list-group" id="analytics-list"><div class="empty">Загрузка…</div></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Add expense -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="expense-modal">
      <div class="modal-header">
        <h3>Новая трата</h3>
        <button class="text-btn" id="modal-close">Отмена</button>
      </div>

      <form id="expense-form">
        <div class="field">
          <label for="exp-description">Описание</label>
          <input id="exp-description" type="text" placeholder="Например: Ужин в кафе" required maxlength="256" />
        </div>
        <div class="row">
          <div class="field">
            <label for="exp-amount">Сумма</label>
            <input id="exp-amount" type="number" step="0.01" min="0.01" required />
          </div>
          <div class="field">
            <label for="exp-paid-by">Кто заплатил</label>
            <select id="exp-paid-by" required></select>
          </div>
        </div>

        <div class="field">
          <label>Разделить на</label>
          <div class="segmented">
            <input type="radio" name="split-type" id="split-equal" value="equal" checked />
            <label for="split-equal">Поровну</label>
            <input type="radio" name="split-type" id="split-custom" value="custom" />
            <label for="split-custom">Вручную</label>
          </div>
        </div>

        <div class="field">
          <label>Участники траты</label>
          <div id="participants-list"></div>
        </div>

        <button class="btn block" type="submit">Добавить трату</button>
        <div class="error" id="expense-error"></div>
      </form>
    </div>
  </div>

  <!-- Expense detail -->
  <div class="modal-overlay" id="detail-modal-overlay">
    <div class="modal" id="expense-detail-modal">
      <div class="modal-header">
        <h3 id="detail-title">Трата</h3>
        <button class="text-btn" id="detail-modal-close">Закрыть</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/group.js"></script>
</body>
</html>
